<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home - Artikel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Daftar Artikel</h1>
    <div th:each="article : ${articles}" class="card mb-3">
        <div class="card-body">
            <h5 class="card-title" th:text="${article.title}">Judul</h5>
            <p class="card-text" th:text="${article.content}">Isi artikel...</p>
            <p class="text-muted" th:text="${#temporals.format(article.createdAt, 'dd-MM-yyyy HH:mm')}"></p>
            <a th:href="@{/article/{id}(id=${article.id})}" class="stretched-link"></a>
        </div>
    </div>
</div>
</body>
</html>
