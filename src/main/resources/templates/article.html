<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home - Artikel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Detail Artikel</h1>
    <div class="pb-4">
        <a href="/" class="btn btn-primary mt-3">Home</a>
    </div>
    <div class="card mb-3">
        <div class="card-body">
            <h5 class="card-title" th:text="${article.title}">Judul</h5>
            <p class="card-text" th:text="${article.content}">Isi artikel...</p>
            <p class="text-muted" th:text="${#temporals.format(article.createdAt, 'dd-MM-yyyy HH:mm')}"></p>
        </div>
    </div>    
    
    <!-- Form Tambah Comment -->
    <form method="post" th:action="@{'/article/' + ${article.id} + '/comment'}" class="mb-4">
        <div class="mb-3">
            <label for="authorName" class="form-label">Nama</label>
            <input type="text" name="authorName" class="form-control" id="authorName" required>
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">Comment</label>
            <textarea name="content" class="form-control" id="content" rows="4" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Tambah Comment</button>
    </form>
    
    <div th:each="comment : ${comments}" class="card mb-3">
        <div class="card-body">
            <h5 class="card-title" th:text="${comment.authorName}">Author Comment</h5>
            <p class="card-text" th:text="${comment.content}">Isi Comment...</p>
            <p class="text-muted" th:text="${#temporals.format(comment.createdAt, 'dd-MM-yyyy HH:mm')}"></p>
        </div>
    </div>
</div>
</body>
</html>
