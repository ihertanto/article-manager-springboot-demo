<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Artikel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Kelola Artikel</h1>

    <!-- Form Tambah Artikel -->
    <form method="post" th:action="@{/admin/articles}" class="mb-4">
        <div class="mb-3">
            <label for="title" class="form-label">Judul</label>
            <input type="text" name="title" class="form-control" id="title" required>
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">Konten</label>
            <textarea name="content" class="form-control" id="content" rows="4" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Tambah Artikel</button>
    </form>

    <!-- Daftar Artikel -->
    <div th:each="article : ${articles}" class="card mb-3">
        <div class="card-body">
            <h5 class="card-title" th:text="${article.title}">Judul</h5>
            <p class="card-text" th:text="${article.content}">Isi artikel...</p>
            <p class="text-muted" th:text="${#temporals.format(article.createdAt, 'dd-MM-yyyy HH:mm')}"></p>
            <a th:href="@{'/admin/articles/delete/' + ${article.id}}" class="btn btn-danger btn-sm">Hapus</a>
        </div>
    </div>
</div>
</body>
</html>
