spring.application.name=article

# =======================
# H2 Database Settings
# =======================

# Aktifkan H2 Console (bisa diakses di browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# URL koneksi ke H2 in-memory database
spring.datasource.url=jdbc:h2:mem:articledb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialek Hibernate untuk H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Auto create/update schema dari entity JPA
spring.jpa.hibernate.ddl-auto=update

# Logging SQL di console (opsional untuk debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
